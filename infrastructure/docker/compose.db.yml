services:
  postgres:
    image: postgres:17.11
    container_name: mini-erp-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${MINI_ERP_POSTGRES_PASSWORD:?MINI_ERP_POSTGRES_PASSWORD must be set}
      MINI_ERP_DEV_DB_PASSWORD: ${MINI_ERP_DEV_DB_PASSWORD:?MINI_ERP_DEV_DB_PASSWORD must be set}
      MINI_ERP_TEST_DB_PASSWORD: ${MINI_ERP_TEST_DB_PASSWORD:?MINI_ERP_TEST_DB_PASSWORD must be set}
    volumes:
      - mini-erp-postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mini-erp-postgres-data:
    name: mini-erp-postgres-data
