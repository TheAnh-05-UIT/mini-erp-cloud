spring:
  application:
    name: mini-erp-backend
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  profiles:
    default: local
  jpa:
    hibernate:
      # Flyway owns schema changes; Hibernate must not alter the database. / Flyway quản lý schema; Hibernate không được tự sửa database.
      ddl-auto: none
  flyway:
    # Versioned migrations are the single schema history. / Migration có version là lịch sử schema duy nhất.
    enabled: true
    locations: classpath:db/migration

server:
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      # Idle timeout only; absolute-session enforcement is implemented separately. / Chỉ timeout idle; absolute session được xử lý riêng.
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: true

mini-erp:
  security:
    session:
      # The issued timestamp is fixed at login; it is not extended by requests. / Mốc issued cố định khi login, không gia hạn bởi request.
      idle-timeout: 30m
      absolute-timeout: 8h
      maximum-concurrent-sessions: 2
