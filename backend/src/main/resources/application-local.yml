spring:
  datasource:
    # Password is required from the environment, never committed. / Password bắt buộc lấy từ environment, không commit.
    url: ${MINI_ERP_DEV_DB_URL:jdbc:postgresql://127.0.0.1:5433/mini_erp_dev}
    username: ${MINI_ERP_DEV_DB_USERNAME:mini_erp_dev_app}
    password: ${MINI_ERP_DEV_DB_PASSWORD}

server:
  servlet:
    session:
      cookie:
        # Local HTTP exception; production HTTPS keeps Secure=true. / Ngoại lệ Local HTTP; production HTTPS giữ Secure=true.
        secure: false
